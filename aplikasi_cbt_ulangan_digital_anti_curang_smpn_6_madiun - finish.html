    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-tealDark-900 text-white border-emerald-400',
        error: 'bg-rose-700 text-white border-rose-400',
        warning: 'bg-amber-600 text-white border-amber-300',
        info: 'bg-slate-900 text-white border-slate-600'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border-l-4 shadow-xl text-xs sm:text-sm font-semibold flex items-center justify-between gap-3 fade-in ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span>${escapeHTML(message)}</span>
        <button type="button" class="text-white/80 hover:text-white font-bold text-base leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.25s ease';
          setTimeout(() => toast.remove(), 260);
        }
      }, 4200);
    }

    function applyLocalStateUpdate(colName, docId, data) {
      if (colName === 'cbt_settings') {
        if (docId === 'main') {
          state.schoolSettings = { ...state.schoolSettings, ...data, id: 'main' };
          syncBrowserTitle();
        } else if (docId === 'anticheat') {
          state.antiCheatPolicy = { ...state.antiCheatPolicy, ...data, id: 'anticheat' };
        } else if (docId === 'token') {
          state.tokenConfig = { ...DEFAULT_TOKEN_CONFIG, ...state.tokenConfig, ...data, id: 'token' };
        }
        persistLocalFallbackToStorage();
        return;
      }
      const map = { cbt_accounts: 'accounts', cbt_exams: 'exams', cbt_questions: 'questions', cbt_results: 'results' };
      const key = map[colName];
      if (!key) return;
      const idx = state[key].findIndex(item => item.id === docId);
      if (idx >= 0) {
        state[key][idx] = { ...state[key][idx], ...data, id: docId };
      } else {
        state[key].push({ ...data, id: docId });
      }
      persistLocalFallbackToStorage();
    }

    function deleteLocalStateItem(colName, docId) {
      const map = { cbt_accounts: 'accounts', cbt_exams: 'exams', cbt_questions: 'questions', cbt_results: 'results' };
      const key = map[colName];
      if (!key) return;
      state[key] = state[key].filter(item => item.id !== docId);
      persistLocalFallbackToStorage();
    }

    async function seedInitialFirestoreData() {
      if (!state.firebaseUser || !state.db) return;
      const appId = state.appId;

      const setRef = collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings');
      const accRef = collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_accounts');
      const examRef = collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_exams');
      const qRef = collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_questions');

      const [setSnap, accSnap, examSnap, qSnap] = await Promise.all([
        getDocs(setRef),
        getDocs(accRef),
        getDocs(examRef),
        getDocs(qRef)
      ]);

      const promises = [];

      if (setSnap.empty) {
        promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings', 'main'), DEFAULT_SCHOOL_SETTINGS));
        promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings', 'anticheat'), DEFAULT_ANTICHEAT_POLICY));
        promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings', 'token'), DEFAULT_TOKEN_CONFIG));
      } else {
        if (!setSnap.docs.some(d => d.id === 'main')) {
          promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings', 'main'), DEFAULT_SCHOOL_SETTINGS));
        }
        if (!setSnap.docs.some(d => d.id === 'anticheat')) {
          promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings', 'anticheat'), DEFAULT_ANTICHEAT_POLICY));
        }
        if (!setSnap.docs.some(d => d.id === 'token')) {
          promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings', 'token'), DEFAULT_TOKEN_CONFIG));
        }
      }

      if (accSnap.empty) {
        DEFAULT_ACCOUNTS.forEach(acc => {
          promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_accounts', acc.id), acc));
        });
      }

      if (examSnap.empty) {
        buildDefaultExams().forEach(ex => {
          promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_exams', ex.id), ex));
        });
      }

      if (qSnap.empty) {
        DEFAULT_QUESTIONS.forEach(q => {
          promises.push(setDoc(doc(state.db, 'artifacts', appId, 'public', 'data', 'cbt_questions', q.id), q));
        });
      }

      if (promises.length > 0) {
        await Promise.all(promises);
      }
    }

    function attachFirestoreListeners() {
      const appId = state.appId;
      const loadedFlags = { set: false, acc: false, ex: false, q: false, res: false };

      const checkAllLoaded = () => {
        if (loadedFlags.set && loadedFlags.acc && loadedFlags.ex && loadedFlags.q && loadedFlags.res) {
          state.isFirebaseReady = true;
          syncBrowserTitle();
          // Check if locked student was approved by Teacher/Admin in real time
          if (state.view === 'exam-locked' && state.lockedResultRecord) {
            const updatedRec = state.results.find(r => r.id === state.lockedResultRecord.id);
            if (updatedRec) {
              state.lockedResultRecord = updatedRec;
              if (updatedRec.statusUjian === 'APPROVED_RESUME') {
                resumeExamFromLockedRecord(updatedRec);
                return;
              } else if (updatedRec.statusUjian === 'APPROVED_RESTART') {
                restartExamFromLockedRecord(updatedRec);
                return;
              }
            }
          }
          if (state.view !== 'exam') {
            render();
          }
        }
      };

      onSnapshot(
        collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_settings'),
        (snap) => {
          const mainDoc = snap.docs.find(d => d.id === 'main');
          if (mainDoc) {
            state.schoolSettings = { ...DEFAULT_SCHOOL_SETTINGS, ...mainDoc.data(), id: 'main' };
          }
          const acDoc = snap.docs.find(d => d.id === 'anticheat');
          if (acDoc) {
            state.antiCheatPolicy = { ...DEFAULT_ANTICHEAT_POLICY, ...acDoc.data(), id: 'anticheat' };
          }
          const tokDoc = snap.docs.find(d => d.id === 'token');
          if (tokDoc) {
            state.tokenConfig = { ...DEFAULT_TOKEN_CONFIG, ...tokDoc.data(), id: 'token' };
          }
          loadedFlags.set = true;
          checkAllLoaded();
        },
        (err) => console.error('Settings snapshot error:', err)
      );

      onSnapshot(
        collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_accounts'),
        (snap) => {
          state.accounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          loadedFlags.acc = true;
          checkAllLoaded();
        },
        (err) => console.error('Accounts snapshot error:', err)
      );

      onSnapshot(
        collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_exams'),
        (snap) => {
          state.exams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          loadedFlags.ex = true;
          checkAllLoaded();
        },
        (err) => console.error('Exams snapshot error:', err)
      );

      onSnapshot(
        collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_questions'),
        (snap) => {
          state.questions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          loadedFlags.q = true;
          checkAllLoaded();
        },
        (err) => console.error('Questions snapshot error:', err)
      );

      onSnapshot(
        collection(state.db, 'artifacts', appId, 'public', 'data', 'cbt_results'),
        (snap) => {
          state.results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          loadedFlags.res = true;
          checkAllLoaded();
        },
        (err) => console.error('Results snapshot error:', err)
      );
    }

    async function initAppBackend() {
      renderLoadingScreen();
      try {
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        if (!rawConfig) {
          initFallbackMemoryData();
          return;
        }
        const firebaseConfig = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : rawConfig;
        const app = initializeApp(firebaseConfig);
        state.auth = getAuth(app);
        state.db = getFirestore(app);

        onAuthStateChanged(state.auth, async (user) => {

              attachFirestoreListeners();

        initFallbackMemoryData();
      }

    function getExpectedExamToken(kelas, jenisUjian) {
      const tCfg = state.tokenConfig || DEFAULT_TOKEN_CONFIG;
      const exCfg = state.exams.find(e => e.kelas === kelas && e.jenisUjian === jenisUjian);
      if (tCfg.allowPackageToken && exCfg && exCfg.tokenKhusus && String(exCfg.tokenKhusus).trim() !== '') {
        return String(exCfg.tokenKhusus).trim().toUpperCase();
      }
      return String(tCfg.tokenGlobal || DEFAULT_TOKEN_CONFIG.tokenGlobal).trim().toUpperCase();
    }

    function generateRandomToken(length = 6) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function buildStudentResultId(nis, kelas, jenisUjian) {
      const cleanNis = String(nis || '').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
      return `res_${cleanNis}_${kelas}_${jenisUjian}`;
    }

    function calculateExamScore(questions, answersMap, manualEssayScores = {}) {
      let totalBobot = 0;
      let earnedScore = 0;
      let hasEssay = false;
      let allEssaysGraded = true;

      questions.forEach(q => {
        const bobot = Number(q.bobot) || 0;
        totalBobot += bobot;
        const ans = (answersMap[q.id] ?? '').toString().trim();

        if (q.tipe === 'pg') {
          if (ans !== '' && ans === String(q.kunci).trim()) {
            earnedScore += bobot;
          }
        } else if (q.tipe === 'isian') {
          if (ans !== '') {
            const acceptedKeys = String(q.kunci)
              .split('|')
              .map(k => k.trim().toLowerCase())
              .filter(Boolean);
            if (acceptedKeys.includes(ans.toLowerCase())) {
              earnedScore += bobot;
            }
          }
        } else if (q.tipe === 'uraian') {
          hasEssay = true;
          if (manualEssayScores && manualEssayScores[q.id] !== undefined && manualEssayScores[q.id] !== null) {
            earnedScore += Math.min(bobot, Math.max(0, Number(manualEssayScores[q.id]) || 0));
          } else {
            allEssaysGraded = false;
          }
        }
      });

      const finalScore = totalBobot > 0 ? Math.round((earnedScore / totalBobot) * 100) : 0;
      const statusKoreksi = hasEssay && !allEssaysGraded ? 'Menunggu Koreksi Guru' : 'Selesai Dinilai';

      return {
        skorObjektif: earnedScore,
        totalBobot: totalBobot,
        skorAkhir: finalScore,
        hasEssay: hasEssay,
        statusKoreksi: statusKoreksi
      };
    }

    function triggerAntiCheatViolation(reasonText) {
      if (!state.antiCheatActive || state.view !== 'exam' || !state.studentSession || state.isSubmitting) {
        return;
      }

      const now = Date.now();
      if (now - state.lastViolationCooldown < 1200) {
        return;
      }
      state.lastViolationCooldown = now;

      state.violationCount += 1;
      const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      state.violationLogs.push(`[${timeStr}] ${reasonText}`);

      const policyMode = state.antiCheatPolicy?.mode || 'strict';
      const maxAllowedWarnings = policyMode === 'warn1' ? 1 : 0;

      if (state.violationCount <= maxAllowedWarnings) {
        showToast(`PERINGATAN KERAS (${state.violationCount}/${maxAllowedWarnings + 1}): ${reasonText}. Pelanggaran berikutnya otomatis mengirim & mengunci ujian!`, 'warning');
        render();
        return;
      }

      // Immediately Lock & Auto-Submit Exam!
      lockAndAutoSubmitExam(reasonText);
    }

    async function lockAndAutoSubmitExam(reasonText) {
      if (state.isSubmitting) return;
      state.isSubmitting = true;
      deactivateAntiCheatMonitor();
      if (state.timerInterval) clearInterval(state.timerInterval);

      const stu = state.studentSession;
      const recordId = buildStudentResultId(stu.nis, stu.kelas, stu.jenisUjian);
      const calc = calculateExamScore(state.examQuestions, state.examAnswers);

      const lockedRecord = {
        id: recordId,
        nama: stu.nama,
        nis: stu.nis,
        kelas: stu.kelas,
        rombel: stu.rombel,
        jenisUjian: stu.jenisUjian,
        jawaban: { ...state.examAnswers },
        nilaiUraianManual: {},
        skorObjektif: calc.skorObjektif,
        totalBobot: calc.totalBobot,
        skorAkhir: calc.skorAkhir,
        statusKoreksi: calc.statusKoreksi,
        statusUjian: 'TERKUNCI - PELANGGARAN',
        violationCount: state.violationCount,
        violationReason: reasonText,
        violationLogs: [...state.violationLogs],
        remainingSecondsSnapshot: state.timeLeftSeconds,
        waktuSelesai: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
        timestamp: Date.now()
      };

      await saveDocument('cbt_results', recordId, lockedRecord);
      exitExamFullscreen();

      state.isSubmitting = false;
      state.lockedResultRecord = lockedRecord;
      state.studentSession = null;
      state.view = 'exam-locked';
      render();
      startLockedApprovalWatcher();
      showToast('PELANGGARAN TERDETEKSI! Ujian otomatis terkirim dan akun Anda dikunci.', 'error');
    }

    function handleVisibilityChange() {
      if (document.hidden) {
        triggerAntiCheatViolation('Membuka Tab Baru / Berpindah Tab Browser');
      }
    }

    function handleWindowBlur() {
      triggerAntiCheatViolation('Membuka Window Baru / Keluar dari Layar Ujian (Cek Email/Aplikasi Lain)');
    }

    function handleFullscreenChange() {
      if (state.antiCheatActive && state.antiCheatPolicy?.requireFullscreen && !document.fullscreenElement) {
        triggerAntiCheatViolation('Keluar dari Mode Layar Penuh (Fullscreen)');
      }
    }

    function handleExamKeydown(e) {
      if (!state.antiCheatActive || state.view !== 'exam') return;

      const key = (e.key || '').toLowerCase();
      const isCtrlOrMeta = e.ctrlKey || e.metaKey;

      if (
        e.key === 'F12' ||
        (isCtrlOrMeta && e.shiftKey && ['i', 'j', 'c'].includes(key)) ||
        (isCtrlOrMeta && ['t', 'n', 'w', 'u', 'c', 'v', 'x', 'p', 's'].includes(key)) ||
        (e.altKey && e.key === 'Tab')
      ) {
        e.preventDefault();
        e.stopPropagation();
        triggerAntiCheatViolation(`Menekan Pintasan Terlarang (${e.ctrlKey ? 'Ctrl+' : e.altKey ? 'Alt+' : ''}${e.key.toUpperCase()})`);
      }
    }

    function handleExamContextMenu(e) {
      if (state.antiCheatActive && state.view === 'exam') {
        e.preventDefault();
        showToast('Klik kanan dinonaktifkan selama ujian berlangsung.', 'warning');
      }
    }

    function handleExamClipboard(e) {
      if (state.antiCheatActive && state.view === 'exam') {
        e.preventDefault();
        triggerAntiCheatViolation('Mencoba Copy / Cut / Paste Konten Ujian');
      }
    }

    function activateAntiCheatMonitor() {
      if (state.antiCheatActive) return;
      state.antiCheatActive = true;
      document.addEventListener('visibilitychange', handleVisibilityChange);
      window.addEventListener('blur', handleWindowBlur);
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('keydown', handleExamKeydown, true);
      document.addEventListener('contextmenu', handleExamContextMenu, true);
      document.addEventListener('copy', handleExamClipboard, true);
      document.addEventListener('cut', handleExamClipboard, true);
      document.addEventListener('paste', handleExamClipboard, true);
    }

    function deactivateAntiCheatMonitor() {
      state.antiCheatActive = false;
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      window.removeEventListener('blur', handleWindowBlur);
      document.removeEventListener('fullscreenchange', handleFullscreenChange);
      document.removeEventListener('keydown', handleExamKeydown, true);
      document.removeEventListener('contextmenu', handleExamContextMenu, true);
      document.removeEventListener('copy', handleExamClipboard, true);
      document.removeEventListener('cut', handleExamClipboard, true);
      document.removeEventListener('paste', handleExamClipboard, true);
    }

    function startLockedApprovalWatcher() {
      if (state.lockedPollInterval) clearInterval(state.lockedPollInterval);
      state.lockedPollInterval = setInterval(async () => {
        if (state.view !== 'exam-locked' || !state.lockedResultRecord) {
          clearInterval(state.lockedPollInterval);
          return;
        }
        if (!state.useLocalFallback && state.firebaseUser && state.db) {
          try {
            const snap = await getDocs(collection(state.db, 'artifacts', state.appId, 'public', 'data', 'cbt_results'));
            const freshList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            state.results = freshList;
            const found = freshList.find(r => r.id === state.lockedResultRecord.id);
            if (found) {
              state.lockedResultRecord = found;
              if (found.statusUjian === 'APPROVED_RESUME') {
                clearInterval(state.lockedPollInterval);
                resumeExamFromLockedRecord(found);
              } else if (found.statusUjian === 'APPROVED_RESTART') {
                clearInterval(state.lockedPollInterval);
                restartExamFromLockedRecord(found);
              } else if (found.statusUjian === 'DISAHKAN_PELANGGARAN') {
                clearInterval(state.lockedPollInterval);
                state.lastSubmittedResult = found;
                state.view = 'exam-summary';
                render();
              }
            }
          } catch (e) {
            // Silent retry
          }
        }
      }, 4000);
    }

    async function resumeExamFromLockedRecord(record) {
      if (state.lockedPollInterval) clearInterval(state.lockedPollInterval);

      const examQuestions = state.questions.filter(q => q.kelas === record.kelas && q.jenisUjian === record.jenisUjian);
      const examConfig = state.exams.find(ex => ex.kelas === record.kelas && ex.jenisUjian === record.jenisUjian) || { durasi: 60 };

      state.studentSession = {
        nama: record.nama,
        nis: record.nis,
        kelas: record.kelas,
        rombel: record.rombel,
        jenisUjian: record.jenisUjian
      };
      state.examQuestions = examQuestions;
      state.examAnswers = { ...(record.jawaban || {}) };
      state.examFlags = {};
      state.currentQuestionIdx = 0;
      state.timeLeftSeconds = Math.max(60, Number(record.remainingSecondsSnapshot) || (Number(examConfig.durasi) || 60) * 60);
      state.violationCount = 0;
      state.violationLogs = [...(record.violationLogs || []), `[${new Date().toLocaleTimeString('id-ID')}] Disetujui lanjut oleh ${record.approvedBy || 'Guru/Admin'}`];
      state.lockedResultRecord = null;
      state.view = 'exam';

      await saveDocument('cbt_results', record.id, {
        ...record,
        statusUjian: 'SEDANG_UJIAN_LANJUTAN'
      });

      if (state.antiCheatPolicy?.requireFullscreen) {
        requestExamFullscreen();
      }
      startExamTimer();
      render();
      setTimeout(() => activateAntiCheatMonitor(), 600);
      showToast('Persetujuan Guru/Admin diterima! Silakan lanjutkan ujian dengan jujur.', 'success');
    }

    async function restartExamFromLockedRecord(record) {
      if (state.lockedPollInterval) clearInterval(state.lockedPollInterval);

      const examQuestions = state.questions.filter(q => q.kelas === record.kelas && q.jenisUjian === record.jenisUjian);
      const examConfig = state.exams.find(ex => ex.kelas === record.kelas && ex.jenisUjian === record.jenisUjian) || { durasi: 60 };

      state.studentSession = {
        nama: record.nama,
        nis: record.nis,
        kelas: record.kelas,
        rombel: record.rombel,
        jenisUjian: record.jenisUjian
      };
      state.examQuestions = examQuestions;
      state.examAnswers = {};
      state.examFlags = {};
      state.currentQuestionIdx = 0;
      state.timeLeftSeconds = (Number(examConfig.durasi) || 60) * 60;
      state.violationCount = 0;
      state.violationLogs = [`[${new Date().toLocaleTimeString('id-ID')}] Diulang dari awal atas persetujuan ${record.approvedBy || 'Guru/Admin'}`];
      state.lockedResultRecord = null;
      state.view = 'exam';

      await saveDocument('cbt_results', record.id, {
        ...record,
        jawaban: {},
        skorObjektif: 0,
        skorAkhir: 0,
        statusUjian: 'SEDANG_UJIAN_ULANG'
      });

      if (state.antiCheatPolicy?.requireFullscreen) {
        requestExamFullscreen();
      }
      startExamTimer();
      render();
      setTimeout(() => activateAntiCheatMonitor(), 600);
      showToast('Ujian dimulai ulang dari awal atas persetujuan Guru/Admin.', 'success');
    }

                  <span class="text-slate-400 block">Nama Peserta</span>
                  <strong class="text-slate-900 font-extrabold">${escapeHTML(cand.nama)}</strong>
                </div>
                <div>
                  <span class="text-slate-400 block">NIS</span>
                  <strong class="text-slate-900 font-extrabold">${escapeHTML(cand.nis)}</strong>
                </div>
                <div>
                  <span class="text-slate-400 block">Kelas / Rombel</span>
                  <strong class="text-tealDark-900 font-extrabold">Kelas ${escapeHTML(cand.kelas)} - ${escapeHTML(cand.rombel)}</strong>
                </div>
                <div>
                  <span class="text-slate-400 block">Paket & Durasi</span>
                  <strong class="text-goldAccent-600 font-extrabold">${escapeHTML(cand.jenisUjian)} • ${examConfig.durasi} Menit (${qCount} Soal)</strong>
                </div>
              </div>

              <!-- Strict Anti-Cheat Warning Box -->
              <div class="bg-rose-50 border-2 border-rose-300 rounded-2xl p-4 sm:p-5 space-y-3">

                  <svg class="w-6 h-6 shrink-0 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                  <h2 class="font-extrabold text-sm sm:text-base">PERINGATAN SISTEM ANTI-CURANG (EXAM LOCKDOWN)</h2>

                <ul class="text-xs sm:text-sm text-rose-950 space-y-1.5 list-disc pl-5 leading-relaxed">
                  <li>Peserta <strong>DILARANG membuka tab baru</strong>, berpindah aplikasi/window lain, atau membuka halaman login/email baru selama ujian berlangsung.</li>

                  <li>Kebijakan Aktif: <strong>${policy.mode === 'strict' ? 'Mode Ketat (0 Toleransi — Pelanggaran pertama langsung mengirim jawaban & mengunci akun)' : 'Peringatan 1x — Pelanggaran kedua otomatis mengirim jawaban & mengunci akun'}</strong>.</li>

    // --------------------- C. STUDENT EXAM INTERFACE VIEW ---------------------
    function renderExamView() {
      const stu = state.studentSession;
      if (!stu || state.examQuestions.length === 0) return renderLoginView();

      const cfg = state.schoolSettings || DEFAULT_SCHOOL_SETTINGS;
      const q = state.examQuestions[state.currentQuestionIdx];
      const totalQ = state.examQuestions.length;
      const answeredCount = state.examQuestions.filter(item => {
        const val = (state.examAnswers[item.id] ?? '').toString().trim();
        return val !== '';
      }).length;

      const mins = Math.floor(state.timeLeftSeconds / 60);
      const secs = state.timeLeftSeconds % 60;
      const timerStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const isLowTime = state.timeLeftSeconds <= 300;

      const fontSizes = {
        small: { qText: 'text-sm sm:text-base', arab: 'text-xl sm:text-2xl', opt: 'text-xs sm:text-sm' },
        normal: { qText: 'text-base sm:text-lg', arab: 'text-2xl sm:text-3xl', opt: 'text-sm sm:text-base' },
        large: { qText: 'text-lg sm:text-xl', arab: 'text-3xl sm:text-4xl', opt: 'text-base sm:text-lg' }
      }[state.fontSizeLevel];

      const currentAnswer = state.examAnswers[q.id] ?? '';
      const isFlagged = !!state.examFlags[q.id];

      return `
        <div class="min-h-screen flex flex-col bg-slate-100 exam-lock-select">
          <!-- Top Exam Bar -->
          <header class="bg-tealDark-900 text-white border-b-4 border-goldAccent-500 sticky top-0 z-30 shadow-md">
            <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                ${renderSchoolLogo('w-9 h-11 sm:w-11 sm:h-13')}
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="px-2 py-0.5 rounded bg-goldAccent-500 text-tealDark-950 text-[10px] font-extrabold">${escapeHTML(stu.jenisUjian)}</span>
                    <span class="text-xs sm:text-sm font-extrabold truncate">${escapeHTML(stu.nama)}</span>
                  </div>
                  <p class="text-[11px] text-emerald-200 truncate">
                    NIS: ${escapeHTML(stu.nis)} • Kelas ${escapeHTML(stu.kelas)}-${escapeHTML(stu.rombel)} • ${escapeHTML(cfg.singkatanMapel)}
                  </p>
                </div>
              </div>

              <!-- Countdown Timer & Font Size Controls -->
              <div class="flex items-center gap-2 shrink-0">
                <div class="hidden md:flex items-center bg-tealDark-950/80 rounded-xl p-1 border border-white/10">
                  <button type="button" onclick="window.setExamFontSize('small')" class="px-2 py-1 rounded-lg text-xs font-bold ${state.fontSizeLevel === 'small' ? 'bg-goldAccent-500 text-tealDark-950' : 'text-emerald-200'}">A-</button>
                  <button type="button" onclick="window.setExamFontSize('normal')" class="px-2 py-1 rounded-lg text-xs font-bold ${state.fontSizeLevel === 'normal' ? 'bg-goldAccent-500 text-tealDark-950' : 'text-emerald-200'}">A</button>
                  <button type="button" onclick="window.setExamFontSize('large')" class="px-2 py-1 rounded-lg text-xs font-bold ${state.fontSizeLevel === 'large' ? 'bg-goldAccent-500 text-tealDark-950' : 'text-emerald-200'}">A+</button>
                </div>

                <div class="px-3 py-1.5 rounded-xl font-mono text-sm sm:text-base font-extrabold tracking-wider flex items-center gap-1.5 ${isLowTime ? 'bg-rose-600 text-white animate-pulse' : 'bg-tealDark-950 text-amber-300 border border-amber-400/40'}">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <span id="exam-timer-display">${timerStr}</span>
                </div>

                <!-- Mobile Question Drawer Button -->
                <button
                  type="button"
                  onclick="window.toggleMobileQuestionNav()"
                  class="lg:hidden px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-extrabold flex items-center gap-1"
                >
                  <span>${answeredCount}/${totalQ}</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
              </div>
            </div>
          </header>

          <!-- Main Exam Body -->
          <div class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- Left/Center Question Card -->
            <div class="lg:col-span-8 bg-white rounded-3xl shadow-sm border border-slate-200 p-5 sm:p-7 space-y-6">
              <!-- Question Header -->
              <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100">
                <div class="flex items-center gap-2">
                  <span class="px-3 py-1 rounded-xl bg-tealDark-900 text-white text-xs sm:text-sm font-extrabold">
                    Soal No. ${state.currentQuestionIdx + 1} <span class="text-emerald-300 font-normal">dari ${totalQ}</span>
                  </span>
                  <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold uppercase">
                    ${q.tipe === 'pg' ? 'Pilihan Ganda' : q.tipe === 'isian' ? 'Isian Singkat' : 'Uraian'}
                  </span>
                </div>

                <span class="text-xs font-bold text-slate-400">Bobot: ${q.bobot} Poin</span>
              </div>

              <!-- Arabic Verse / Hadith if present -->
              ${q.arab ? `
                <div class="p-4 sm:p-5 rounded-2xl bg-emerald-50/70 border border-emerald-200/80 text-right">
                  <p class="arabic-text ${fontSizes.arab} text-tealDark-950 font-bold" dir="rtl">${escapeHTML(q.arab)}</p>
                </div>
              ` : ''}

              <!-- Question Prompt -->
              <div class="${fontSizes.qText} font-semibold text-slate-900 leading-relaxed">
                ${escapeHTML(q.pertanyaan)}

              <!-- Answer Input Area -->
              <div class="pt-2">
                ${q.tipe === 'pg' ? `
                  <div class="space-y-3">
                    ${(q.opsi || []).map((optText, idx) => {
                      const letter = String.fromCharCode(65 + idx);
                      const isSelected = String(currentAnswer) === String(idx);
                      return `
                        <button
                          type="button"
                          onclick="window.selectExamAnswer('${q.id}', '${idx}')"
                          class="w-full text-left p-3.5 sm:p-4 rounded-2xl border-2 flex items-start gap-3.5 transition ${isSelected ? 'border-tealDark-800 bg-emerald-50/80 shadow-xs' : 'border-slate-200 hover:border-tealDark-700/40 bg-white'}"
                        >
                          <span class="w-8 h-8 rounded-xl flex items-center justify-center font-extrabold text-sm shrink-0 transition ${isSelected ? 'bg-tealDark-900 text-white' : 'bg-slate-100 text-slate-700'}">
                            ${letter}
                          </span>
                          <span class="${fontSizes.opt} font-medium text-slate-800 pt-1 leading-snug">${escapeHTML(optText)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                ` : q.tipe === 'isian' ? `
                  <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Ketik Jawaban Singkat Anda:</label>
                    <input
                      type="text"
                      value="${escapeHTML(currentAnswer)}"
                      oninput="window.updateTextExamAnswer('${q.id}', this.value)"
                      placeholder="Tuliskan jawaban singkat dan tepat di sini..."
                      class="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-300 focus:border-tealDark-700 focus:outline-none text-base font-bold text-slate-900 bg-slate-50 focus:bg-white transition"
                    />
                  </div>
                ` : `
                  <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Tuliskan Jawaban Uraian Anda Secara Lengkap:</label>
                    <textarea
                      rows="5"
                      oninput="window.updateTextExamAnswer('${q.id}', this.value)"
                      placeholder="Jelaskan jawaban Anda secara jelas dan runtut..."
                      class="w-full p-4 rounded-2xl border-2 border-slate-300 focus:border-tealDark-700 focus:outline-none text-sm sm:text-base font-medium text-slate-900 bg-slate-50 focus:bg-white transition leading-relaxed"
                    >${escapeHTML(currentAnswer)}</textarea>
                  </div>
                `}
              </div>

              <!-- Bottom Navigation Buttons -->
              <div class="pt-5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                <button
                  type="button"
                  onclick="window.prevExamQuestion()"
                  ${state.currentQuestionIdx === 0 ? 'disabled' : ''}
                  class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-40 text-slate-700 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                  <span>Sebelumnya</span>
                </button>

                <button
                  type="button"
                  onclick="window.toggleExamFlag('${q.id}')"
                  class="px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center gap-1.5 border transition ${isFlagged ? 'bg-amber-500 text-tealDark-950 border-amber-500 shadow-xs' : 'bg-amber-50 text-amber-800 border-amber-200 hover:bg-amber-100'}"
                >
                  <svg class="w-4 h-4" fill="${isFlagged ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/></svg>
                  <span>${isFlagged ? 'Ditandai Ragu' : 'Ragu-Ragu'}</span>
                </button>

                ${state.currentQuestionIdx < totalQ - 1 ? `
                  <button
                    type="button"
                    onclick="window.nextExamQuestion()"
                    class="px-5 py-2.5 rounded-xl bg-tealDark-900 hover:bg-tealDark-800 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow transition"
                  >
                    <span>Selanjutnya</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                  </button>
                ` : `
                  <button
                    type="button"
                    onclick="window.confirmSubmitExam()"
                    class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-goldAccent-600 to-goldAccent-500 hover:from-amber-600 hover:to-amber-500 text-tealDark-950 font-extrabold text-xs sm:text-sm flex items-center gap-1.5 shadow transition"
                  >
                    <span>Selesai & Kumpulkan</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                  </button>
                `}
              </div>
            </div>

            <!-- Right Desktop Question Number Grid -->
            <aside class="hidden lg:block lg:col-span-4 bg-white rounded-3xl shadow-sm border border-slate-200 p-5 space-y-4 sticky top-20">
              <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-extrabold text-sm text-tealDark-900">Navigasi Nomor Soal</h3>
                <span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-tealDark-900 text-xs font-extrabold">${answeredCount} / ${totalQ} Dijawab</span>
              </div>

              <div class="grid grid-cols-5 gap-2">
                ${state.examQuestions.map((item, idx) => {
                  const hasAns = (state.examAnswers[item.id] ?? '').toString().trim() !== '';
                  const flagged = !!state.examFlags[item.id];
                  const isCurrent = idx === state.currentQuestionIdx;

                  let btnClass = 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200';
                  if (flagged) btnClass = 'bg-amber-400 text-tealDark-950 border-amber-500';
                  else if (hasAns) btnClass = 'bg-tealDark-800 text-white border-tealDark-900';

                  return `
                    <button
                      type="button"
                      onclick="window.jumpToExamQuestion(${idx})"
                      class="h-10 rounded-xl border font-extrabold text-xs transition ${btnClass} ${isCurrent ? 'ring-2 ring-offset-2 ring-tealDark-900' : ''}"
                    >
                      ${idx + 1}
                    </button>
                  `;
                }).join('')}
              </div>

              <div class="pt-3 border-t border-slate-100 flex flex-wrap gap-3 text-[11px] text-slate-500">
                <span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded bg-tealDark-800 inline-block"></i> Dijawab</span>
                <span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded bg-amber-400 inline-block"></i> Ragu</span>
                <span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded bg-slate-200 inline-block"></i> Belum</span>
              </div>

              <button
                type="button"
                onclick="window.confirmSubmitExam()"
                class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-tealDark-900 to-tealDark-700 hover:from-tealDark-950 hover:to-tealDark-800 text-white font-extrabold text-xs sm:text-sm shadow transition"
              >
                Kumpulkan Jawaban Ujian
              </button>
            </aside>
          </div>

          <!-- Mobile Drawer Modal for Question Grid -->
          ${state.mobileNavOpen ? `
            <div class="fixed inset-0 z-40 bg-slate-950/60 flex items-end lg:hidden" onclick="if(event.target===this) window.toggleMobileQuestionNav()">
              <div class="w-full bg-white rounded-t-3xl p-5 space-y-4 max-h-[80vh] overflow-y-auto fade-in">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 class="font-extrabold text-sm text-tealDark-900">Pilih Nomor Soal (${answeredCount}/${totalQ} Dijawab)</h3>
                  <button type="button" onclick="window.toggleMobileQuestionNav()" class="w-8 h-8 rounded-full bg-slate-100 font-bold text-slate-600">&times;</button>
                </div>
                <div class="grid grid-cols-5 gap-2">
                  ${state.examQuestions.map((item, idx) => {
                    const hasAns = (state.examAnswers[item.id] ?? '').toString().trim() !== '';
                    const flagged = !!state.examFlags[item.id];
                    const isCurrent = idx === state.currentQuestionIdx;
                    let btnClass = 'bg-slate-100 text-slate-700 border-slate-200';
                    if (flagged) btnClass = 'bg-amber-400 text-tealDark-950 border-amber-500';
                    else if (hasAns) btnClass = 'bg-tealDark-800 text-white border-tealDark-900';

                    return `
                      <button
                        type="button"
                        onclick="window.jumpToExamQuestion(${idx}); window.toggleMobileQuestionNav();"
                        class="h-11 rounded-xl border font-extrabold text-xs ${btnClass} ${isCurrent ? 'ring-2 ring-offset-1 ring-tealDark-900' : ''}"
                      >
                        ${idx + 1}
                      </button>
                    `;
                  }).join('')}
                </div>
                <button
                  type="button"
                  onclick="window.toggleMobileQuestionNav(); window.confirmSubmitExam();"
                  class="w-full py-3 rounded-xl bg-tealDark-900 text-white font-extrabold text-sm"
                >
                  Kumpulkan Jawaban Ujian
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // --- TAB 3: REKAP NILAI & KOREKSI URAIAN ---
    function renderAdminResultsTab() {
      const filteredResults = state.results
        .filter(r => {
          if (state.resFilterKelas !== 'ALL' && r.kelas !== state.resFilterKelas) return false;
          if (state.resFilterRombel !== 'ALL' && r.rombel !== state.resFilterRombel) return false;
          if (state.resFilterJenis !== 'ALL' && r.jenisUjian !== state.resFilterJenis) return false;
          if (state.resFilterStatus !== 'ALL' && r.statusKoreksi !== state.resFilterStatus) return false;
          if (state.resSearch.trim() !== '') {
            const q = state.resSearch.trim().toLowerCase();
            if (!String(r.nama).toLowerCase().includes(q) && !String(r.nis).toLowerCase().includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      return `
        <div class="space-y-6 fade-in">
          <div class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 shadow-2xs space-y-4">

                <span>Ekspor Rekap CSV / Excel</span>
              </button>

            <!-- Filters -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
              <select onchange="window.updateResultFilter('resFilterKelas', this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold">
                <option value="ALL" ${state.resFilterKelas === 'ALL' ? 'selected' : ''}>Semua Kelas</option>
                ${CLASSES.map(k => `<option value="${k}" ${state.resFilterKelas === k ? 'selected' : ''}>Kelas ${k}</option>`).join('')}

              <select onchange="window.updateResultFilter('resFilterRombel', this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold">
                <option value="ALL" ${state.resFilterRombel === 'ALL' ? 'selected' : ''}>Semua Rombel</option>
                ${ROMBELS.map(r => `<option value="${r}" ${state.resFilterRombel === r ? 'selected' : ''}>Rombel ${r}</option>`).join('')}
              </select>

              <select onchange="window.updateResultFilter('resFilterJenis', this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold">
                <option value="ALL" ${state.resFilterJenis === 'ALL' ? 'selected' : ''}>Semua Ulangan</option>
                ${EXAM_TYPES.map(t => `<option value="${t.code}" ${state.resFilterJenis === t.code ? 'selected' : ''}>${t.code}</option>`).join('')}
              </select>

              <select onchange="window.updateResultFilter('resFilterStatus', this.value)" class="px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-bold">
                <option value="ALL" ${state.resFilterStatus === 'ALL' ? 'selected' : ''}>Semua Status</option>

              </select>

              <input

                oninput="window.updateResultFilter('resSearch', this.value)"

                class="col-span-2 sm:col-span-1 px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 text-xs font-semibold"
              />
            </div>

            <!-- Results Table -->
            <div class="overflow-x-auto border border-slate-200 rounded-2xl">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                    <th class="p-3 font-extrabold">Nama Siswa & NIS</th>
                    <th class="p-3 font-extrabold">Kelas</th>
                    <th class="p-3 font-extrabold">Ulangan</th>
                    <th class="p-3 font-extrabold">Nilai Akhir</th>

                        <strong class="text-slate-900 block">${escapeHTML(r.nama)}</strong>
                        <span class="text-slate-400">NIS: ${escapeHTML(r.nis)}</span>

                      <td class="p-3 font-bold">${escapeHTML(r.kelas)}-${escapeHTML(r.rombel)}</td>

                      <td class="p-3"><span class="text-base font-extrabold text-tealDark-900">${r.skorAkhir}</span></td>

                        <span class="block text-[10px] text-slate-400">${escapeHTML(r.statusUjian || 'SELESAI_NORMAL')}</span>
                      </td>
                      <td class="p-3 text-right space-x-1.5 whitespace-nowrap">
                        <button
                          type="button"
                          onclick="window.openEssayGradingModal('${r.id}')"
                          class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-tealDark-950 font-extrabold"

                          Detail & Koreksi

                        <button
                          type="button"
                          onclick="window.confirmDeleteResult('${r.id}')"
                          class="px-2.5 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold"

                          Hapus

                    </tr>

    // =========================================================================
    // 7. GLOBAL WINDOW EVENT HANDLERS
    // =========================================================================

    // --- Login Actions ---
    window.switchLoginTab = (tab) => {
      state.loginTab = tab;
      state.loginTokenError = '';
      render();
    };

    window.togglePasswordVisibility = (inputId) => {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      inp.type = inp.type === 'password' ? 'text' : 'password';
    };

    window.fillDemoTeacher = (u, p) => {
      const uEl = document.getElementById('tea-user');
      const pEl = document.getElementById('tea-pass');
      if (uEl) uEl.value = u;
      if (pEl) pEl.value = p;
    };

    window.handleTeacherLogin = (e) => {
      e.preventDefault();
      const username = document.getElementById('tea-user').value.trim();
      const password = document.getElementById('tea-pass').value;

      const found = state.accounts.find(
        acc => acc.username.toLowerCase() === username.toLowerCase() && acc.password === password
      );

      if (!found) {
        showToast('Username atau Password Guru/Admin salah!', 'error');
        return;
      }

      state.teacherUser = found;
      state.adminTab = 'proctor';
      state.view = 'admin';
      render();
      showToast(`Selamat datang, ${found.nama}!`, 'success');
    };

    window.logoutTeacher = () => {
      state.teacherUser = null;
      state.view = 'login';
      render();
      showToast('Anda telah keluar dari dashboard pengelola.', 'info');
    };

    window.handleStudentLogin = async (e) => {
      e.preventDefault();
      state.loginTokenError = '';
      const nama = document.getElementById('stu-nama').value.trim();
      const nis = document.getElementById('stu-nis').value.trim();
      const kelas = document.getElementById('stu-kelas').value;
      const rombel = document.getElementById('stu-rombel').value;
      const jenisUjian = document.getElementById('stu-jenis').value;
      const tokenInputEl = document.getElementById('stu-token');
      const enteredToken = tokenInputEl ? tokenInputEl.value.trim().toUpperCase() : '';

      if (!nama || !nis) {
        showToast('Mohon lengkapi Nama Lengkap dan NIS Anda.', 'error');
        return;
      }

      // Sync latest results & settings from Firestore if connected
      if (!state.useLocalFallback && state.firebaseUser && state.db) {
        try {
          const [resSnap, setSnap, exSnap] = await Promise.all([
            getDocs(collection(state.db, 'artifacts', state.appId, 'public', 'data', 'cbt_results')),
            getDocs(collection(state.db, 'artifacts', state.appId, 'public', 'data', 'cbt_settings')),
            getDocs(collection(state.db, 'artifacts', state.appId, 'public', 'data', 'cbt_exams'))
          ]);
          state.results = resSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const tokDoc = setSnap.docs.find(d => d.id === 'token');
          if (tokDoc) {
            state.tokenConfig = { ...DEFAULT_TOKEN_CONFIG, ...tokDoc.data(), id: 'token' };
          }
          if (!exSnap.empty) {
            state.exams = exSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          }
        } catch (err) {
          // Ignore sync error
        }
      }

      // Check existing student record for (NIS + Kelas + JenisUjian)
      const recordId = buildStudentResultId(nis, kelas, jenisUjian);
      const existingRecord = state.results.find(r =>
        r.id === recordId ||
        (String(r.nis).trim() === nis && r.kelas === kelas && r.jenisUjian === jenisUjian)
      );

      if (existingRecord) {
        if (existingRecord.statusUjian === 'TERKUNCI - PELANGGARAN') {
          state.lockedResultRecord = existingRecord;
          state.view = 'exam-locked';
          render();
          startLockedApprovalWatcher();
          showToast('AKSES DITOLAK: Akun ujian Anda sedang TERKUNCI karena pelanggaran!', 'error');
          return;
        }

        if (existingRecord.statusUjian === 'APPROVED_RESUME') {
          showToast('Persetujuan Guru/Admin ditemukan. Melanjutkan ujian Anda...', 'success');
          await resumeExamFromLockedRecord(existingRecord);
          return;
        }

        if (existingRecord.statusUjian === 'APPROVED_RESTART') {
          showToast('Persetujuan mengulang ditemukan. Memulai ujian baru...', 'success');
          await restartExamFromLockedRecord(existingRecord);
          return;
        }

        if (existingRecord.statusUjian === 'SELESAI_NORMAL' || existingRecord.statusUjian === 'DISAHKAN_PELANGGARAN') {
          state.lastSubmittedResult = existingRecord;
          state.view = 'exam-summary';
          render();
          showToast('Anda sudah menyelesaikan paket ulangan ini.', 'info');
          return;
        }
      }

      // Check if exam package is active
      const examConfig = state.exams.find(ex => ex.kelas === kelas && ex.jenisUjian === jenisUjian) || { aktif: true, durasi: 60 };
      if (!examConfig.aktif) {
        showToast(`Maaf, Ujian ${jenisUjian} untuk Kelas ${kelas} saat ini sedang dinonaktifkan oleh Guru.`, 'warning');
        return;
      }

      // Validate Exam Token for newly logging-in students
      const expectedToken = getExpectedExamToken(kelas, jenisUjian);
      if (!enteredToken || enteredToken !== expectedToken) {
        const errMsg = !enteredToken
          ? 'Token Ujian wajib diisi! Mintalah token kepada Guru / Pengawas ruang.'
          : 'Token Ujian tidak valid! Periksa kembali token dari Guru / Pengawas.';
        state.loginTokenError = errMsg;
        const errBox = document.getElementById('stu-token-error-box');
        const errText = document.getElementById('stu-token-error-text');
        if (errBox && errText) {
          errText.textContent = errMsg;
          errBox.classList.remove('hidden');
        }
        if (tokenInputEl) tokenInputEl.focus();
        showToast(errMsg, 'error');
        return;
      }

      // Check questions availability
      const examQuestions = state.questions.filter(q => q.kelas === kelas && q.jenisUjian === jenisUjian);
      if (examQuestions.length === 0) {
        showToast(`Belum ada soal yang tersedia untuk Kelas ${kelas} (${jenisUjian}). Hubungi Guru.`, 'warning');
        return;
      }

      // Go to Pre-Exam Anti-Cheat Rules Confirmation
      state.pendingExamCandidate = { nama, nis, kelas, rombel, jenisUjian };
      state.view = 'exam-rules';
      render();
    };

    window.cancelExamRules = () => {
      state.pendingExamCandidate = null;
      state.view = 'login';
      render();
    };

    window.confirmAndStartExam = async () => {
      const cand = state.pendingExamCandidate;
      if (!cand) return;

      const examQuestions = state.questions.filter(q => q.kelas === cand.kelas && q.jenisUjian === cand.jenisUjian);
      const examConfig = state.exams.find(ex => ex.kelas === cand.kelas && ex.jenisUjian === cand.jenisUjian) || { durasi: 60 };

      state.studentSession = { ...cand };
      state.pendingExamCandidate = null;
      state.examQuestions = examQuestions;
      state.examAnswers = {};
      state.examFlags = {};
      state.currentQuestionIdx = 0;
      state.timeLeftSeconds = (Number(examConfig.durasi) || 60) * 60;
      state.violationCount = 0;
      state.violationLogs = [];
      state.view = 'exam';

      if (state.antiCheatPolicy?.requireFullscreen) {
        requestExamFullscreen();
      }
      startExamTimer();
      render();
      setTimeout(() => activateAntiCheatMonitor(), 600);
    };

    // --- Exam Runtime Actions ---
    function startExamTimer() {
      if (state.timerInterval) clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        if (state.view !== 'exam') {
          clearInterval(state.timerInterval);
          return;
        }
        state.timeLeftSeconds -= 1;
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          const mins = Math.max(0, Math.floor(state.timeLeftSeconds / 60));
          const secs = Math.max(0, state.timeLeftSeconds % 60);
          timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        if (state.timeLeftSeconds <= 0) {
          clearInterval(state.timerInterval);
          showToast('Waktu ujian telah habis! Jawaban dikumpulkan otomatis.', 'warning');
          submitExamNormal();
        }
      }, 1000);
    }

    window.setExamFontSize = (lvl) => {
      state.fontSizeLevel = lvl;
      render();
    };

    window.toggleMobileQuestionNav = () => {
      state.mobileNavOpen = !state.mobileNavOpen;
      render();
    };

    window.selectExamAnswer = (qId, val) => {
      state.examAnswers[qId] = val;
      render();
    };

    window.updateTextExamAnswer = (qId, val) => {
      state.examAnswers[qId] = val;
    };

    window.toggleExamFlag = (qId) => {
      state.examFlags[qId] = !state.examFlags[qId];
      render();
    };

    window.jumpToExamQuestion = (idx) => {
      if (idx >= 0 && idx < state.examQuestions.length) {
        state.currentQuestionIdx = idx;
        render();
      }
    };

    window.prevExamQuestion = () => {
      if (state.currentQuestionIdx > 0) {
        state.currentQuestionIdx -= 1;
        render();
      }
    };

    window.nextExamQuestion = () => {
      if (state.currentQuestionIdx < state.examQuestions.length - 1) {
        state.currentQuestionIdx += 1;
        render();
      }
    };

    window.confirmSubmitExam = () => {
      const totalQ = state.examQuestions.length;
      const answeredCount = state.examQuestions.filter(item => (state.examAnswers[item.id] ?? '').toString().trim() !== '').length;
      const unanswered = totalQ - answeredCount;

      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="text-lg font-extrabold text-tealDark-900">Konfirmasi Pengumpulan Ujian</h3>
          <p class="text-sm text-slate-600 leading-relaxed">
            Anda telah menjawab <strong>${answeredCount}</strong> dari <strong>${totalQ}</strong> soal.
            ${unanswered > 0 ? `<span class="text-rose-600 font-bold block mt-1">Perhatian: Masih ada ${unanswered} soal yang belum dijawab!</span>` : '<span class="text-tealDark-700 font-bold block mt-1">Semua soal sudah terisi dengan baik.</span>'}
          </p>
          <div class="flex justify-end gap-2.5 pt-2">
            <button type="button" onclick="window.closeModal()" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-bold text-xs">Periksa Lagi</button>
            <button type="button" onclick="window.closeModal(); window.executeSubmitExamNormal();" class="px-5 py-2.5 rounded-xl bg-tealDark-900 hover:bg-tealDark-800 text-white font-extrabold text-xs shadow">Ya, Kumpulkan Sekarang</button>
          </div>
        </div>
      `);
    };

    window.executeSubmitExamNormal = () => {
      submitExamNormal();
    };

    async function submitExamNormal() {
      if (state.isSubmitting || !state.studentSession) return;
      state.isSubmitting = true;
      deactivateAntiCheatMonitor();
      if (state.timerInterval) clearInterval(state.timerInterval);

      const stu = state.studentSession;
      const recordId = buildStudentResultId(stu.nis, stu.kelas, stu.jenisUjian);
      const calc = calculateExamScore(state.examQuestions, state.examAnswers);

      const resultRecord = {
        id: recordId,
        nama: stu.nama,
        nis: stu.nis,
        kelas: stu.kelas,
        rombel: stu.rombel,
        jenisUjian: stu.jenisUjian,
        jawaban: { ...state.examAnswers },
        nilaiUraianManual: {},
        skorObjektif: calc.skorObjektif,
        totalBobot: calc.totalBobot,
        skorAkhir: calc.skorAkhir,
        statusKoreksi: calc.statusKoreksi,
        statusUjian: 'SELESAI_NORMAL',
        violationCount: state.violationCount,
        violationLogs: [...state.violationLogs],
        waktuSelesai: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
        timestamp: Date.now()
      };

      await saveDocument('cbt_results', recordId, resultRecord);
      exitExamFullscreen();

      state.isSubmitting = false;
      state.lastSubmittedResult = resultRecord;
      state.studentSession = null;
      state.view = 'exam-summary';
      render();
      showToast('Jawaban ujian berhasil dikumpulkan!', 'success');
    }

    window.finishAndBackToLogin = () => {

    function parseDelimitedCSV(rawText) {
      const cleaned = String(rawText || '').replace(/^\uFEFF/, '').trim();
      if (!cleaned) return [];

      // Auto-detect delimiter (semicolon for Indonesian Excel vs comma for standard CSV)
      const firstLine = cleaned.split(/\r?\n/)[0] || '';
      let semiCount = 0;
      let commaCount = 0;
      let inQuotes = false;
      for (let i = 0; i < firstLine.length; i++) {
        const ch = firstLine[i];
        if (ch === '"') inQuotes = !inQuotes;
        else if (!inQuotes) {
          if (ch === ';') semiCount++;
          else if (ch === ',') commaCount++;
        }
      }
      const delimiter = semiCount >= commaCount && semiCount > 0 ? ';' : ',';

      const rows = [];
      let currentRow = [];
      let currentField = '';
      inQuotes = false;

      for (let i = 0; i < cleaned.length; i++) {
        const ch = cleaned[i];
        const nextCh = cleaned[i + 1];

        if (inQuotes) {
          if (ch === '"' && nextCh === '"') {
            currentField += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            currentField += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === delimiter) {
            currentRow.push(currentField.trim());
            currentField = '';
          } else if (ch === '\r' && nextCh === '\n') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += ch;
          }
        }
      }

      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
      }

      return rows.filter(r => r.some(cell => cell !== ''));
    }

    function normalizeKelasCode(raw) {
      const val = String(raw || '').trim().toUpperCase();
      if (val === '7' || val === 'VII' || val === 'KELAS VII' || val === 'KELAS 7') return 'VII';
      if (val === '8' || val === 'VIII' || val === 'KELAS VIII' || val === 'KELAS 8') return 'VIII';
      if (val === '9' || val === 'IX' || val === 'KELAS IX' || val === 'KELAS 9') return 'IX';
      return CLASSES.includes(val) ? val : '';
    }

    function parseUploadedQuestionsText(rawText, overrideTarget) {
      const rows = parseDelimitedCSV(rawText);
      const validQuestions = [];
      const rowErrors = [];

      if (rows.length < 2) {
        return { validQuestions, rowErrors: ['File kosong atau hanya berisi baris judul kolom tanpa data soal.'] };
      }

      const rawHeaders = rows[0].map(h =>
        String(h || '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '_')
          .replace(/^_|_$/g, '')
      );

      const findColIdx = (aliases) => rawHeaders.findIndex(h => aliases.includes(h));

      const idxKelas = findColIdx(['kelas', 'tingkat']);
      const idxJenis = findColIdx(['jenis_ujian', 'jenis', 'ulangan', 'paket']);
      const idxTipe = findColIdx(['tipe', 'format', 'jenis_soal']);
      const idxArab = findColIdx(['teks_arab', 'arab', 'ayat']);
      const idxPertanyaan = findColIdx(['pertanyaan', 'soal', 'teks_soal']);
      const idxOpsiA = findColIdx(['opsi_a', 'pilihan_a', 'a']);
      const idxOpsiB = findColIdx(['opsi_b', 'pilihan_b', 'b']);
      const idxOpsiC = findColIdx(['opsi_c', 'pilihan_c', 'c']);
      const idxOpsiD = findColIdx(['opsi_d', 'pilihan_d', 'd']);
      const idxKunci = findColIdx(['kunci', 'kunci_jawaban', 'jawaban']);
      const idxBobot = findColIdx(['bobot', 'poin', 'skor']);

      if (idxPertanyaan === -1 || idxKunci === -1) {
        return {
          validQuestions,
          rowErrors: ['Header template tidak sesuai! Pastikan terdapat kolom "pertanyaan" dan "kunci" (gunakan tombol Template Soal .CSV).']
        };
      }

      const baseTimestamp = Date.now();

      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const lineNum = r + 1;

        const rawKelas = idxKelas >= 0 ? row[idxKelas] : '';
        const rawJenis = idxJenis >= 0 ? row[idxJenis] : '';
        const rawTipe = (idxTipe >= 0 ? row[idxTipe] : 'pg').toLowerCase();
        const arab = idxArab >= 0 ? (row[idxArab] || '').trim() : '';
        const pertanyaan = (row[idxPertanyaan] || '').trim();
        const rawKunci = (row[idxKunci] || '').trim();
        const rawBobot = idxBobot >= 0 ? row[idxBobot] : '10';

        const kelas = overrideTarget
          ? state.filterKelas
          : (normalizeKelasCode(rawKelas) || state.filterKelas);

        const cleanJenis = String(rawJenis || '').trim().toUpperCase();
        const jenisUjian = overrideTarget
          ? state.filterJenis
          : (['STS', 'SAS', 'SAT'].includes(cleanJenis) ? cleanJenis : state.filterJenis);

        let tipe = 'pg';
        if (rawTipe.includes('isian')) tipe = 'isian';
        else if (rawTipe.includes('uraian') || rawTipe.includes('essay') || rawTipe.includes('esai')) tipe = 'uraian';
        else if (rawTipe === 'pg' || rawTipe.includes('pilihan')) tipe = 'pg';
        else {
          rowErrors.push(`Baris ${lineNum}: Format soal "${rawTipe}" tidak dikenali (gunakan: pg, isian, atau uraian).`);
          continue;
        }

        if (!pertanyaan) {
          rowErrors.push(`Baris ${lineNum}: Teks pertanyaan masih kosong.`);
          continue;
        }

        let opsi = [];
        let kunci = '';

        if (tipe === 'pg') {
          const optA = idxOpsiA >= 0 ? (row[idxOpsiA] || '').trim() : '';
          const optB = idxOpsiB >= 0 ? (row[idxOpsiB] || '').trim() : '';
          const optC = idxOpsiC >= 0 ? (row[idxOpsiC] || '').trim() : '';
          const optD = idxOpsiD >= 0 ? (row[idxOpsiD] || '').trim() : '';

          if (!optA || !optB || !optC || !optD) {
            rowErrors.push(`Baris ${lineNum}: Pilihan Ganda wajib mengisi keempat opsi (opsi_a, opsi_b, opsi_c, opsi_d).`);
            continue;
          }
          opsi = [optA, optB, optC, optD];

          const kUp = rawKunci.toUpperCase();
          const keyMap = { A: '0', B: '1', C: '2', D: '3', '0': '0', '1': '1', '2': '2', '3': '3' };
          if (keyMap[kUp] === undefined) {
            rowErrors.push(`Baris ${lineNum}: Kunci PG "${rawKunci}" tidak valid (isi dengan A, B, C, atau D).`);
            continue;
          }
          kunci = keyMap[kUp];
        } else {
          if (!rawKunci) {
            rowErrors.push(`Baris ${lineNum}: Kunci jawaban / rubrik untuk soal ${tipe.toUpperCase()} wajib diisi.`);
            continue;
          }
          kunci = rawKunci;
        }

        const parsedBobot = Math.max(1, Math.min(100, Number(rawBobot) || 10));

        validQuestions.push({
          id: `q_imp_${baseTimestamp}_${r}`,
          kelas,
          jenisUjian,
          tipe,
          arab,
          pertanyaan,
          opsi,
          kunci,
          bobot: parsedBobot
        });
      }

      return { validQuestions, rowErrors };
    }

      state.settingsDraft.logoUrl = '';
      render();
      showToast('Pratinjau logo dikembalikan ke Logo Resmi SMPN 6 Madiun. Klik Simpan Perubahan.', 'info');
    };

    window.handleLogoFileUpload = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 260;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL('image/png', 0.85);

          if (!state.settingsDraft) {
            state.settingsDraft = { ...DEFAULT_SCHOOL_SETTINGS, ...state.schoolSettings };
          }
          state.settingsDraft.logoUrl = compressedDataUrl;
          render();
          showToast('Gambar logo berhasil dimuat! Klik "Simpan Perubahan" untuk menerapkan.', 'success');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.handleSaveSchoolSettings = async (e) => {
      e.preventDefault();
      const draft = state.settingsDraft || { ...DEFAULT_SCHOOL_SETTINGS, ...state.schoolSettings };
      const cleanSettings = {
        id: 'main',
        namaSekolah: draft.namaSekolah.trim() || DEFAULT_SCHOOL_SETTINGS.namaSekolah,
        namaMapel: draft.namaMapel.trim() || DEFAULT_SCHOOL_SETTINGS.namaMapel,
        singkatanMapel: draft.singkatanMapel.trim() || DEFAULT_SCHOOL_SETTINGS.singkatanMapel,
        tahunPelajaran: draft.tahunPelajaran.trim() || DEFAULT_SCHOOL_SETTINGS.tahunPelajaran,
        logoUrl: (draft.logoUrl || '').trim()
      };

      await saveDocument('cbt_settings', 'main', cleanSettings);
      state.settingsDraft = { ...cleanSettings };
      syncBrowserTitle();
      render();
      showToast('Identitas Sekolah, Mata Pelajaran, dan Logo berhasil disimpan!', 'success');
    };

    // =========================================================================
    // 8. MASTER RENDER DISPATCHER & STARTUP
    // =========================================================================
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.isFirebaseReady) {
        renderLoadingScreen();
        return;
      }

      switch (state.view) {
        case 'exam-rules':
          app.innerHTML = renderExamRulesView();
          break;
        case 'exam':
          app.innerHTML = renderExamView();
          break;
        case 'exam-locked':
          app.innerHTML = renderExamLockedView();
          break;
        case 'exam-summary':
          app.innerHTML = renderExamSummaryView();
          break;
        case 'admin':
          app.innerHTML = renderAdminView();
          break;
        case 'login':
        default:
          app.innerHTML = renderLoginView();
          break;
      }
    }

    // Boot Application
    initAppBackend();
  </script>
</body>
</html>
